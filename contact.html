<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Wen Zeng</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <a href="index.html">Wen ZENG</a>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="transport-gis.html">Transport GIS</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <main>
      <section class="section-contact">
        <div class="contact-container">
          <h1>Get in Touch</h1>
          <div class="contact-content">
            <div class="contact-info">
              <h2>Contact Information</h2>
              <p class="contact-intro">You can contact me directly by email:</p>
              <div class="contact-details">
                <div class="contact-item">
                  <i class="fas fa-envelope"></i>
                  <p>Wen.Zeng.001@gmail.com</p>
                </div>
                <div class="contact-item">
                  <i class="fas fa-map-marker-alt"></i>
                  <p>Canberra, Australia</p>
                </div>
              </div>
              <div class="social-links">
                <a
                  href="https://twitter.com/WenZeng15"
                  target="_blank"
                  aria-label="Twitter"
                >
                  <i class="fab fa-twitter"></i>
                </a>
                <a
                  href="https://www.linkedin.com/in/wen-zeng-8b045074"
                  target="_blank"
                  aria-label="LinkedIn"
                >
                  <i class="fab fa-linkedin"></i>
                </a>
                <a
                  href="https://github.com/Wen-Zeng"
                  target="_blank"
                  aria-label="GitHub"
                >
                  <i class="fab fa-github"></i>
                </a>
              </div>
            </div>

            <form
              class="contact-form"
              action="https://formsubmit.co/343297170c497ed830db4d52dace9c59"
              method="POST"
            >
              <!-- Honeypot -->
              <input type="text" name="_honey" style="display: none" />

              <!-- Disable Captcha -->
              <input type="hidden" name="_captcha" value="false" />

              <!-- Success Page -->
              <input
                type="hidden"
                name="_next"
                value="https://wen-zeng.github.io/thanks.html"
              />

              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Your Name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Your Email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="subject">Subject</label>
                <input
                  type="text"
                  id="subject"
                  name="_subject"
                  placeholder="Subject"
                  required
                />
              </div>

              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="Your Message"
                  required
                ></textarea>
              </div>

              <button type="submit" class="submit-btn">
                <span>Send Message</span>
                <i class="fas fa-paper-plane"></i>
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <p>&copy; 2025 Wen Zeng. All rights reserved.</p>
        <div class="footer-social">
          <a
            href="https://twitter.com/WenZeng15"
            target="_blank"
            aria-label="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/wen-zeng-8b045074"
            target="_blank"
            aria-label="LinkedIn"
          >
            <i class="fab fa-linkedin"></i>
          </a>
          <a
            href="https://github.com/Wen-Zeng"
            target="_blank"
            aria-label="GitHub"
          >
            <i class="fab fa-github"></i>
          </a>
        </div>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
