    <main>
      <h1>Transport GIS</h1>
      <p>
        Interactive map showing the development of China's transport networks
        over time.
      </p>

      <div id="map" style="height: 600px"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
      // Initialize the map
      const map = L.map("map").setView([35.8617, 104.1954], 4);

      // Add CartoDB dark theme base layer
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 19,
        }
      ).addTo(map);

      // Create layer groups for each transport type and year
      const highSpeedRailwayLayers = {};
      const regularRailwayLayers = {};
      const highSpeedRailwayStationLayers = {};
      const railwayStationLayers = {};
      const regularRailwayStationLayers = {};
      const motorwayLayers = {};
      const highwayLayers = {};
      const waterwayLayers = {};

      // Initialize layers for each year
      for (let year = 2003; year <= 2020; year++) {
        highSpeedRailwayLayers[year] = L.layerGroup();
        highSpeedRailwayStationLayers[year] = L.layerGroup();
      }

      for (let year = 1995; year <= 2020; year++) {
        regularRailwayLayers[year] = L.layerGroup();
        railwayStationLayers[year] = L.layerGroup();
        regularRailwayStationLayers[year] = L.layerGroup();
      }

      motorwayLayers[1993] = L.layerGroup();
      motorwayLayers[2020] = L.layerGroup();
      highwayLayers[1993] = L.layerGroup();
      highwayLayers[2020] = L.layerGroup();
      waterwayLayers[2020] = L.layerGroup();

      // Create base layers object with dark theme
      const baseLayers = {
        "Dark Map": L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ),
      };

      // Create overlay layers object with groups
      const overlayLayers = {
        "High-Speed Railway": {
          2003: highSpeedRailwayLayers[2003],
          2004: highSpeedRailwayLayers[2004],
          2005: highSpeedRailwayLayers[2005],
          2006: highSpeedRailwayLayers[2006],
          2007: highSpeedRailwayLayers[2007],
          2008: highSpeedRailwayLayers[2008],
          2009: highSpeedRailwayLayers[2009],
          2010: highSpeedRailwayLayers[2010],
          2011: highSpeedRailwayLayers[2011],
          2012: highSpeedRailwayLayers[2012],
          2013: highSpeedRailwayLayers[2013],
          2014: highSpeedRailwayLayers[2014],
          2015: highSpeedRailwayLayers[2015],
          2016: highSpeedRailwayLayers[2016],
          2017: highSpeedRailwayLayers[2017],
          2018: highSpeedRailwayLayers[2018],
          2019: highSpeedRailwayLayers[2019],
          2020: highSpeedRailwayLayers[2020],
        },
        "Regular Railway": {
          1995: regularRailwayLayers[1995],
          2020: regularRailwayLayers[2020],
        },
        "High-Speed Railway Station": {
          2003: highSpeedRailwayStationLayers[2003],
          2004: highSpeedRailwayStationLayers[2004],
          2005: highSpeedRailwayStationLayers[2005],
          2006: highSpeedRailwayStationLayers[2006],
          2007: highSpeedRailwayStationLayers[2007],
          2008: highSpeedRailwayStationLayers[2008],
          2009: highSpeedRailwayStationLayers[2009],
          2010: highSpeedRailwayStationLayers[2010],
          2011: highSpeedRailwayStationLayers[2011],
          2012: highSpeedRailwayStationLayers[2012],
          2013: highSpeedRailwayStationLayers[2013],
          2014: highSpeedRailwayStationLayers[2014],
          2015: highSpeedRailwayStationLayers[2015],
          2016: highSpeedRailwayStationLayers[2016],
          2017: highSpeedRailwayStationLayers[2017],
          2018: highSpeedRailwayStationLayers[2018],
          2019: highSpeedRailwayStationLayers[2019],
          2020: highSpeedRailwayStationLayers[2020],
        },
        "Railway Station": {
          1995: railwayStationLayers[1995],
          1996: railwayStationLayers[1996],
          1997: railwayStationLayers[1997],
          1998: railwayStationLayers[1998],
          1999: railwayStationLayers[1999],
          2000: railwayStationLayers[2000],
          2001: railwayStationLayers[2001],
          2002: railwayStationLayers[2002],
          2003: railwayStationLayers[2003],
          2004: railwayStationLayers[2004],
          2005: railwayStationLayers[2005],
          2006: railwayStationLayers[2006],
          2007: railwayStationLayers[2007],
          2008: railwayStationLayers[2008],
          2009: railwayStationLayers[2009],
          2010: railwayStationLayers[2010],
          2011: railwayStationLayers[2011],
          2012: railwayStationLayers[2012],
          2013: railwayStationLayers[2013],
          2014: railwayStationLayers[2014],
          2015: railwayStationLayers[2015],
          2016: railwayStationLayers[2016],
          2017: railwayStationLayers[2017],
          2018: railwayStationLayers[2018],
          2019: railwayStationLayers[2019],
          2020: railwayStationLayers[2020],
        },
        "Regular Railway Station": {
          1995: regularRailwayStationLayers[1995],
          1996: regularRailwayStationLayers[1996],
          1997: regularRailwayStationLayers[1997],
          1998: regularRailwayStationLayers[1998],
          1999: regularRailwayStationLayers[1999],
          2000: regularRailwayStationLayers[2000],
          2001: regularRailwayStationLayers[2001],
          2002: regularRailwayStationLayers[2002],
          2003: regularRailwayStationLayers[2003],
          2004: regularRailwayStationLayers[2004],
          2005: regularRailwayStationLayers[2005],
          2006: regularRailwayStationLayers[2006],
          2007: regularRailwayStationLayers[2007],
          2008: regularRailwayStationLayers[2008],
          2009: regularRailwayStationLayers[2009],
          2010: regularRailwayStationLayers[2010],
          2011: regularRailwayStationLayers[2011],
          2012: regularRailwayStationLayers[2012],
          2013: regularRailwayStationLayers[2013],
          2014: regularRailwayStationLayers[2014],
          2015: regularRailwayStationLayers[2015],
          2016: regularRailwayStationLayers[2016],
          2017: regularRailwayStationLayers[2017],
          2018: regularRailwayStationLayers[2018],
          2019: regularRailwayStationLayers[2019],
          2020: regularRailwayStationLayers[2020],
        },
        Motorway: {
          1993: motorwayLayers[1993],
          2020: motorwayLayers[2020],
        },
        Highway: {
          1993: highwayLayers[1993],
          2020: highwayLayers[2020],
        },
        Waterway: {
          2020: waterwayLayers[2020],
        },
      };

      // Add layer control to the map
      const layerControl = L.control
        .layers(baseLayers, overlayLayers, {
          position: "topleft",
          collapsed: false,
        })
        .addTo(map);

      // Function to load GeoJSON data
      async function loadGeoJSON(path, layer, style) {
        try {
          console.log("Loading:", path);
          const response = await fetch(
            `https://transport-gis-backend.onrender.com/api/geojson/${path}`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json; charset=utf-8",
              },
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const text = await response.text();

          try {
            const data = JSON.parse(text);

            const geoJsonLayer = L.geoJSON(data, {
              style: style,
              onEachFeature: function (feature, layer) {
                if (feature.properties) {
                  let popupContent = '<div class="popup-content">';
                  for (let prop in feature.properties) {
                    if (
                      feature.properties[prop] !== null &&
                      feature.properties[prop] !== undefined
                    ) {
                      popupContent += `<p><strong>${prop}:</strong> ${feature.properties[prop]}</p>`;
                    }
                  }
                  popupContent += "</div>";
                  layer.bindPopup(popupContent);
                }
              },
            });

            geoJsonLayer.addTo(layer);
            return geoJsonLayer;
          } catch (parseError) {
            console.error("JSON Parse Error:", parseError);
            console.error("Response text:", text.substring(0, 200) + "...");
            throw new Error("Invalid JSON format");
          }
        } catch (error) {
          console.error("Error loading GeoJSON:", error);
          console.error("Path:", path);
          throw error;
        }
      }

      // Initialize map and load layers
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // Load High-Speed Railway layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/HighSpeedRailway/HighSpeedRailway${year}.geojson`,
              highSpeedRailwayLayers[year],
              { color: "red", weight: 2 }
            );
          }

          // Load Regular Railway layers (1995, 2020)
          await Promise.all([
            loadGeoJSON(
              "Data/RegularRailway/RegularRailway1995.geojson",
              regularRailwayLayers[1995],
              { color: "orange", weight: 2 }
            ),
            loadGeoJSON(
              "Data/RegularRailway/RegularRailway2020.geojson",
              regularRailwayLayers[2020],
              { color: "orange", weight: 2 }
            ),
          ]);

          // Load High-Speed Railway Station layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/HighSpeedRailwayStation/HighSpeedRailwayStation${year}.geojson`,
              highSpeedRailwayStationLayers[year],
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/RailwayStation/RailwayStations${year}.geojson`,
              railwayStationLayers[year],
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Regular Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/RegularRailwayStation/RegularRailwayStation${year}.geojson`,
              regularRailwayStationLayers[year],
              {
                radius: 5,
                fillColor: "orange",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Motorway layers (1993, 2020)
          await Promise.all([
            loadGeoJSON(
              "Data/Motorway/Motorway1993.geojson",
              motorwayLayers[1993],
              {
                color: "blue",
                weight: 2,
              }
            ),
            loadGeoJSON(
              "Data/Motorway/Motorway2020.geojson",
              motorwayLayers[2020],
              {
                color: "blue",
                weight: 2,
              }
            ),
          ]);

          // Load Highway layers (1993, 2020)
          await Promise.all([
            loadGeoJSON(
              "Data/Highway/Highways1993.geojson",
              highwayLayers[1993],
              {
                color: "green",
                weight: 2,
              }
            ),
            loadGeoJSON(
              "Data/Highway/Highways2020.geojson",
              highwayLayers[2020],
              {
                color: "green",
                weight: 2,
              }
            ),
          ]);

          // Load Waterway layer
          await loadGeoJSON(
            "Data/Waterway/Waterway.geojson",
            waterwayLayers[2020],
            {
              color: "cyan",
              weight: 2,
            }
          );

          // Add 2020 High-Speed Railway layer to the map by default
          highSpeedRailwayLayers[2020].addTo(map);
        } catch (error) {
          console.error("Error loading layers:", error);
        }
      });
    </script>
  </body>
</html>
