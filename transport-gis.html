<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport GIS - Your Name</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <style>
      #map {
        height: 600px;
        width: 100%;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="transport-gis.html">Transport GIS</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main>
      <h1>Transport GIS</h1>
      <p>
        Interactive map showing the development of China's transport networks
        over time.
      </p>

      <div id="map" style="height: 600px"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
      // Initialize the map
      const map = L.map("map").setView([35.8617, 104.1954], 4);

      // Add CartoDB dark theme base layer
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 19,
        }
      ).addTo(map);

      // Create layer groups for each transport type
      const highSpeedRailwayLayer = L.layerGroup();
      const highSpeedRailway2003Layer = L.layerGroup();
      const regularRailwayLayer = L.layerGroup();
      const railwayStationLayer = L.layerGroup();
      const motorwayLayer = L.layerGroup();
      const highwayLayer = L.layerGroup();
      const waterwayLayer = L.layerGroup();

      // Create base layers object with dark theme
      const baseLayers = {
        "Dark Map": L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ),
      };

      // Create overlay layers object with nested groups
      const overlayLayers = {
        "High-Speed Railway": {
          2020: highSpeedRailwayLayer,
          2003: highSpeedRailway2003Layer,
        },
        "Regular Railway": regularRailwayLayer,
        "Railway Station": railwayStationLayer,
        Motorway: motorwayLayer,
        Highway: highwayLayer,
        Waterway: waterwayLayer,
      };

      // Add layer control to the map
      const layerControl = L.control
        .layers(baseLayers, overlayLayers, {
          position: "topleft",
          collapsed: false,
        })
        .addTo(map);

      // Function to load GeoJSON data
      async function loadGeoJSON(path, layer, style) {
        try {
          console.log("Loading:", path);
          const response = await fetch(
            `https://transport-gis-backend.onrender.com/api/geojson/${path}`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json; charset=utf-8",
              },
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const text = await response.text();

          try {
            const data = JSON.parse(text);

            const geoJsonLayer = L.geoJSON(data, {
              style: style,
              onEachFeature: function (feature, layer) {
                if (feature.properties) {
                  let popupContent = '<div class="popup-content">';
                  for (let prop in feature.properties) {
                    if (
                      feature.properties[prop] !== null &&
                      feature.properties[prop] !== undefined
                    ) {
                      popupContent += `<p><strong>${prop}:</strong> ${feature.properties[prop]}</p>`;
                    }
                  }
                  popupContent += "</div>";
                  layer.bindPopup(popupContent);
                }
              },
            });

            geoJsonLayer.addTo(layer);
            return geoJsonLayer;
          } catch (parseError) {
            console.error("JSON Parse Error:", parseError);
            console.error("Response text:", text.substring(0, 200) + "...");
            throw new Error("Invalid JSON format");
          }
        } catch (error) {
          console.error("Error loading GeoJSON:", error);
          console.error("Path:", path);
          throw error;
        }
      }

      // Initialize map and load layers
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // Load High-Speed Railway layers
          await Promise.all([
            loadGeoJSON(
              "Data/HighSpeedRailway/HighSpeedRailway2020.geojson",
              highSpeedRailwayLayer,
              { color: "red", weight: 2 }
            ),
            loadGeoJSON(
              "Data/HighSpeedRailway/HighSpeedRailway2003.geojson",
              highSpeedRailway2003Layer,
              { color: "red", weight: 2 }
            ),
          ]);

          // Add High-Speed Railway 2020 layer to the map by default
          highSpeedRailwayLayer.addTo(map);

          // Update the layer control to show High-Speed Railway 2020 as checked
          const layerControlContainer = document.querySelector(
            ".leaflet-control-layers-list"
          );
          if (layerControlContainer) {
            const checkboxes = layerControlContainer.querySelectorAll(
              'input[type="checkbox"]'
            );
            checkboxes.forEach((checkbox, index) => {
              // First checkbox is High-Speed Railway 2020
              checkbox.checked = index === 0;
            });
          }

          // Load other layers in the background
          await Promise.all([
            loadGeoJSON(
              "Data/RegularRailway/RegularRailway2020.geojson",
              regularRailwayLayer,
              { color: "orange", weight: 2 }
            ),
            loadGeoJSON(
              "Data/RailwayStation/RailwayStations2020.geojson",
              railwayStationLayer,
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            ),
            loadGeoJSON("Data/Motorway/Motorway2020.geojson", motorwayLayer, {
              color: "blue",
              weight: 2,
            }),
            loadGeoJSON("Data/Highway/Highways2020.geojson", highwayLayer, {
              color: "green",
              weight: 2,
            }),
            loadGeoJSON("Data/Waterway/Waterway.geojson", waterwayLayer, {
              color: "cyan",
              weight: 2,
            }),
          ]);
        } catch (error) {
          console.error("Error loading layers:", error);
        }
      });
    </script>
  </body>
</html>
