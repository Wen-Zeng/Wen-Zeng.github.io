<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport GIS - Your Name</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <style>
      #map {
        height: 600px;
        width: 100%;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="transport-gis.html">Transport GIS</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main>
      <h1>Transport GIS</h1>
      <p>
        Interactive map showing the development of China's transport networks
        over time.
      </p>

      <div id="map" style="height: 600px"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
      // Initialize the map
      const map = L.map("map").setView([35.8617, 104.1954], 4);

      // Add CartoDB dark theme base layer
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 19,
        }
      ).addTo(map);

      // Create main layer groups for each transport type
      const highSpeedRailwayGroup = L.layerGroup();
      const regularRailwayGroup = L.layerGroup();
      const highSpeedRailwayStationGroup = L.layerGroup();
      const railwayStationGroup = L.layerGroup();
      const regularRailwayStationGroup = L.layerGroup();
      const motorwayGroup = L.layerGroup();
      const highwayGroup = L.layerGroup();
      const waterwayGroup = L.layerGroup();

      // Create base layers object with dark theme
      const baseLayers = {
        "Dark Map": L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: "abcd",
            maxZoom: 19,
          }
        ),
      };

      // Create overlay layers object with groups
      const overlayLayers = {
        "High-Speed Railway": highSpeedRailwayGroup,
        "Regular Railway": regularRailwayGroup,
        "High-Speed Railway Station": highSpeedRailwayStationGroup,
        "Railway Station": railwayStationGroup,
        "Regular Railway Station": regularRailwayStationGroup,
        Motorway: motorwayGroup,
        Highway: highwayGroup,
        Waterway: waterwayGroup,
      };

      // Add layer control to the map
      const layerControl = L.control
        .layers(baseLayers, overlayLayers, {
          position: "topleft",
          collapsed: false,
        })
        .addTo(map);

      // Function to load GeoJSON data
      async function loadGeoJSON(path, layer, style) {
        try {
          console.log("Loading:", path);
          const response = await fetch(
            `https://transport-gis-backend.onrender.com/api/geojson/${path}`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json; charset=utf-8",
              },
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const text = await response.text();

          try {
            const data = JSON.parse(text);

            const geoJsonLayer = L.geoJSON(data, {
              style: style,
              onEachFeature: function (feature, layer) {
                if (feature.properties) {
                  let popupContent = '<div class="popup-content">';
                  for (let prop in feature.properties) {
                    if (
                      feature.properties[prop] !== null &&
                      feature.properties[prop] !== undefined
                    ) {
                      popupContent += `<p><strong>${prop}:</strong> ${feature.properties[prop]}</p>`;
                    }
                  }
                  popupContent += "</div>";
                  layer.bindPopup(popupContent);
                }
              },
            });

            geoJsonLayer.addTo(layer);
            return geoJsonLayer;
          } catch (parseError) {
            console.error("JSON Parse Error:", parseError);
            console.error("Response text:", text.substring(0, 200) + "...");
            throw new Error("Invalid JSON format");
          }
        } catch (error) {
          console.error("Error loading GeoJSON:", error);
          console.error("Path:", path);
          throw error;
        }
      }

      // Initialize map and load layers
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // Load High-Speed Railway layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/HighSpeedRailway/HighSpeedRailway${year}.geojson`,
              highSpeedRailwayGroup,
              { color: "red", weight: 2 }
            );
          }

          // Load Regular Railway layers (1995, 2020)
          await Promise.all([
            loadGeoJSON(
              "Data/RegularRailway/RegularRailway1995.geojson",
              regularRailwayGroup,
              { color: "orange", weight: 2 }
            ),
            loadGeoJSON(
              "Data/RegularRailway/RegularRailway2020.geojson",
              regularRailwayGroup,
              { color: "orange", weight: 2 }
            ),
          ]);

          // Load High-Speed Railway Station layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/HighSpeedRailwayStation/HighSpeedRailwayStation${year}.geojson`,
              highSpeedRailwayStationGroup,
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/RailwayStation/RailwayStations${year}.geojson`,
              railwayStationGroup,
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Regular Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            await loadGeoJSON(
              `Data/RegularRailwayStation/RegularRailwayStation${year}.geojson`,
              regularRailwayStationGroup,
              {
                radius: 5,
                fillColor: "orange",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
          }

          // Load Motorway layers (1993, 2020)
          await Promise.all([
            loadGeoJSON("Data/Motorway/Motorway1993.geojson", motorwayGroup, {
              color: "blue",
              weight: 2,
            }),
            loadGeoJSON("Data/Motorway/Motorway2020.geojson", motorwayGroup, {
              color: "blue",
              weight: 2,
            }),
          ]);

          // Load Highway layers (1993, 2020)
          await Promise.all([
            loadGeoJSON("Data/Highway/Highways1993.geojson", highwayGroup, {
              color: "green",
              weight: 2,
            }),
            loadGeoJSON("Data/Highway/Highways2020.geojson", highwayGroup, {
              color: "green",
              weight: 2,
            }),
          ]);

          // Load Waterway layer
          await loadGeoJSON("Data/Waterway/Waterway.geojson", waterwayGroup, {
            color: "cyan",
            weight: 2,
          });

          // Add High-Speed Railway layer to the map by default
          highSpeedRailwayGroup.addTo(map);
        } catch (error) {
          console.error("Error loading layers:", error);
        }
      });
    </script>
  </body>
</html>
