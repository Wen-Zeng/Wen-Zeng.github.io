<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport GIS - Your Name</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <style>
      #map {
        height: 600px;
        width: 100%;
        margin: 20px 0;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="transport-gis.html">Transport GIS</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main>
      <h1>Transport GIS</h1>
      <p>
        Interactive map showing the development of China's transport networks
        over time.
      </p>

      <div id="map" style="height: 600px"></div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
      // Initialize the map
      const map = L.map("map").setView([35.8617, 104.1954], 4);

      // Add CartoDB dark theme base layer
      const baseLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          maxZoom: 19,
        }
      ).addTo(map);

      // Create base layers object
      const baseLayers = {
        "Dark Map": baseLayer,
      };

      // Create overlay layers object with nested groups
      const overlayLayers = {
        "High-Speed Railway": L.layerGroup(),
        "Regular Railway": L.layerGroup(),
        "High-Speed Railway Station": L.layerGroup(),
        "Railway Station": L.layerGroup(),
        "Regular Railway Station": L.layerGroup(),
        Motorway: L.layerGroup(),
        Highway: L.layerGroup(),
        Waterway: L.layerGroup(),
      };

      // Create year-based layer groups for each transport type
      const highSpeedRailwayLayers = {};
      const regularRailwayLayers = {};
      const highSpeedRailwayStationLayers = {};
      const railwayStationLayers = {};
      const regularRailwayStationLayers = {};
      const motorwayLayers = {};
      const highwayLayers = {};
      const waterwayLayers = {};

      // Initialize year-based layers
      for (let year = 2003; year <= 2020; year++) {
        highSpeedRailwayLayers[year] = L.layerGroup();
        highSpeedRailwayStationLayers[year] = L.layerGroup();
      }

      for (let year = 1995; year <= 2020; year++) {
        regularRailwayLayers[year] = L.layerGroup();
        railwayStationLayers[year] = L.layerGroup();
        regularRailwayStationLayers[year] = L.layerGroup();
      }

      motorwayLayers[1993] = L.layerGroup();
      motorwayLayers[2020] = L.layerGroup();
      highwayLayers[1993] = L.layerGroup();
      highwayLayers[2020] = L.layerGroup();
      waterwayLayers[2020] = L.layerGroup();

      // Add year-based layers to their respective transport type groups
      for (let year = 2003; year <= 2020; year++) {
        highSpeedRailwayLayers[year].addTo(overlayLayers["High-Speed Railway"]);
        highSpeedRailwayStationLayers[year].addTo(
          overlayLayers["High-Speed Railway Station"]
        );
      }

      for (let year = 1995; year <= 2020; year++) {
        regularRailwayLayers[year].addTo(overlayLayers["Regular Railway"]);
        railwayStationLayers[year].addTo(overlayLayers["Railway Station"]);
        regularRailwayStationLayers[year].addTo(
          overlayLayers["Regular Railway Station"]
        );
      }

      motorwayLayers[1993].addTo(overlayLayers["Motorway"]);
      motorwayLayers[2020].addTo(overlayLayers["Motorway"]);
      highwayLayers[1993].addTo(overlayLayers["Highway"]);
      highwayLayers[2020].addTo(overlayLayers["Highway"]);
      waterwayLayers[2020].addTo(overlayLayers["Waterway"]);

      // Add layer control to the map
      L.control
        .layers(baseLayers, overlayLayers, {
          position: "topleft",
          collapsed: false,
        })
        .addTo(map);

      // Function to load GeoJSON data
      async function loadGeoJSON(path, style) {
        try {
          console.log("Loading:", path);
          const response = await fetch(
            `https://transport-gis-backend.onrender.com/api/geojson/${path}`,
            {
              method: "GET",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json; charset=utf-8",
              },
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();
          return L.geoJSON(data, {
            style: style,
            onEachFeature: function (feature, layer) {
              if (feature.properties) {
                let popupContent = '<div class="popup-content">';
                for (let prop in feature.properties) {
                  if (
                    feature.properties[prop] !== null &&
                    feature.properties[prop] !== undefined
                  ) {
                    popupContent += `<p><strong>${prop}:</strong> ${feature.properties[prop]}</p>`;
                  }
                }
                popupContent += "</div>";
                layer.bindPopup(popupContent);
              }
            },
          });
        } catch (error) {
          console.error("Error loading GeoJSON:", error);
          console.error("Path:", path);
          throw error;
        }
      }

      // Initialize map and load layers
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          // Load High-Speed Railway layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            const layer = await loadGeoJSON(
              `Data/HighSpeedRailway/HighSpeedRailway${year}.geojson`,
              { color: "red", weight: 2 }
            );
            layer.addTo(highSpeedRailwayLayers[year]);
          }

          // Load Regular Railway layers (1995, 2020)
          const regularRailway1995 = await loadGeoJSON(
            "Data/RegularRailway/RegularRailway1995.geojson",
            { color: "orange", weight: 2 }
          );
          regularRailway1995.addTo(regularRailwayLayers[1995]);

          const regularRailway2020 = await loadGeoJSON(
            "Data/RegularRailway/RegularRailway2020.geojson",
            { color: "orange", weight: 2 }
          );
          regularRailway2020.addTo(regularRailwayLayers[2020]);

          // Load High-Speed Railway Station layers (2003-2020)
          for (let year = 2003; year <= 2020; year++) {
            const layer = await loadGeoJSON(
              `Data/HighSpeedRailwayStation/HighSpeedRailwayStation${year}.geojson`,
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
            layer.addTo(highSpeedRailwayStationLayers[year]);
          }

          // Load Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            const layer = await loadGeoJSON(
              `Data/RailwayStation/RailwayStations${year}.geojson`,
              {
                radius: 5,
                fillColor: "red",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
            layer.addTo(railwayStationLayers[year]);
          }

          // Load Regular Railway Station layers (1995-2020)
          for (let year = 1995; year <= 2020; year++) {
            const layer = await loadGeoJSON(
              `Data/RegularRailwayStation/RegularRailwayStation${year}.geojson`,
              {
                radius: 5,
                fillColor: "orange",
                color: "white",
                weight: 2,
                fillOpacity: 1,
              }
            );
            layer.addTo(regularRailwayStationLayers[year]);
          }

          // Load Motorway layers (1993, 2020)
          const motorway1993 = await loadGeoJSON(
            "Data/Motorway/Motorway1993.geojson",
            { color: "blue", weight: 2 }
          );
          motorway1993.addTo(motorwayLayers[1993]);

          const motorway2020 = await loadGeoJSON(
            "Data/Motorway/Motorway2020.geojson",
            { color: "blue", weight: 2 }
          );
          motorway2020.addTo(motorwayLayers[2020]);

          // Load Highway layers (1993, 2020)
          const highway1993 = await loadGeoJSON(
            "Data/Highway/Highways1993.geojson",
            { color: "green", weight: 2 }
          );
          highway1993.addTo(highwayLayers[1993]);

          const highway2020 = await loadGeoJSON(
            "Data/Highway/Highways2020.geojson",
            { color: "green", weight: 2 }
          );
          highway2020.addTo(highwayLayers[2020]);

          // Load Waterway layer
          const waterwayLayer = await loadGeoJSON(
            "Data/Waterway/Waterway.geojson",
            { color: "cyan", weight: 2 }
          );
          waterwayLayer.addTo(waterwayLayers[2020]);

          // Add 2020 High-Speed Railway layer to the map by default
          highSpeedRailwayLayers[2020].addTo(map);
        } catch (error) {
          console.error("Error loading layers:", error);
        }
      });
    </script>
  </body>
</html>
