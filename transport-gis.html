<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport GIS - Your Name</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- OpenLayers CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol@v7.4.0/ol.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.1/dist/ol-layerswitcher.css"
    />
    <style>
      #map {
        height: 600px;
        width: 100%;
        margin: 20px 0;
      }
      .ol-control {
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 4px;
        padding: 2px;
      }
      .ol-control button {
        background-color: #fff;
        color: #333;
        border: none;
        border-radius: 4px;
        margin: 1px;
        padding: 0;
        font-size: 1.14em;
        height: 1.375em;
        width: 1.375em;
        line-height: 0.5em;
      }
      .ol-control button:hover {
        background-color: #f8f8f8;
      }
      .ol-layerswitcher {
        top: 0.5em;
        right: 0.5em;
      }
      .ol-layerswitcher button {
        background-color: #fff;
        color: #333;
        border: none;
        border-radius: 4px;
        margin: 1px;
        padding: 0;
        font-size: 1.14em;
        height: 1.375em;
        width: 1.375em;
        line-height: 0.5em;
      }
      .ol-layerswitcher button:hover {
        background-color: #f8f8f8;
      }
      .ol-layerswitcher-panel {
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 4px;
        padding: 5px;
        max-height: 400px;
        overflow-y: auto;
      }
      .ol-layerswitcher-panel label {
        display: block;
        margin: 5px 0;
      }
      .ol-layerswitcher-panel input[type="checkbox"] {
        margin-right: 5px;
      }
      .ol-layerswitcher-panel .group {
        margin-left: 15px;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="transport-gis.html">Transport GIS</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <main>
      <h1>Transport GIS</h1>
      <p>
        Interactive map showing the development of China's transport networks
        over time.
      </p>

      <div id="map"></div>
    </main>

    <!-- OpenLayers JS -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.1/dist/ol-layerswitcher.js"></script>
    <script>
      // Initialize the map
      const map = new ol.Map({
        target: "map",
        layers: [
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              url: "https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
              attributions:
                '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
            }),
          }),
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([104.1954, 35.8617]),
          zoom: 4,
        }),
      });

      // Create layer groups
      const highSpeedRailwayGroup = new ol.layer.Group({
        title: "High-Speed Railway",
        layers: [
          new ol.layer.Vector({
            title: "2020",
            visible: true,
            source: new ol.source.Vector({
              url: "https://transport-gis-backend.onrender.com/api/geojson/Data/HighSpeedRailway/HighSpeedRailway2020.geojson",
              format: new ol.format.GeoJSON(),
            }),
            style: new ol.style.Style({
              stroke: new ol.style.Stroke({
                color: "red",
                width: 2,
              }),
            }),
          }),
          new ol.layer.Vector({
            title: "2003",
            visible: false,
            source: new ol.source.Vector({
              url: "https://transport-gis-backend.onrender.com/api/geojson/Data/HighSpeedRailway/HighSpeedRailway2003.geojson",
              format: new ol.format.GeoJSON(),
            }),
            style: new ol.style.Style({
              stroke: new ol.style.Stroke({
                color: "red",
                width: 2,
              }),
            }),
          }),
        ],
      });

      const regularRailwayLayer = new ol.layer.Vector({
        title: "Regular Railway",
        visible: false,
        source: new ol.source.Vector({
          url: "https://transport-gis-backend.onrender.com/api/geojson/Data/RegularRailway/RegularRailway2020.geojson",
          format: new ol.format.GeoJSON(),
        }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: "orange",
            width: 2,
          }),
        }),
      });

      const railwayStationLayer = new ol.layer.Vector({
        title: "Railway Station",
        visible: false,
        source: new ol.source.Vector({
          url: "https://transport-gis-backend.onrender.com/api/geojson/Data/RailwayStation/RailwayStations2020.geojson",
          format: new ol.format.GeoJSON(),
        }),
        style: new ol.style.Style({
          image: new ol.style.Circle({
            radius: 5,
            fill: new ol.style.Fill({
              color: "red",
            }),
            stroke: new ol.style.Stroke({
              color: "white",
              width: 2,
            }),
          }),
        }),
      });

      const motorwayLayer = new ol.layer.Vector({
        title: "Motorway",
        visible: false,
        source: new ol.source.Vector({
          url: "https://transport-gis-backend.onrender.com/api/geojson/Data/Motorway/Motorway2020.geojson",
          format: new ol.format.GeoJSON(),
        }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: "blue",
            width: 2,
          }),
        }),
      });

      const highwayLayer = new ol.layer.Vector({
        title: "Highway",
        visible: false,
        source: new ol.source.Vector({
          url: "https://transport-gis-backend.onrender.com/api/geojson/Data/Highway/Highways2020.geojson",
          format: new ol.format.GeoJSON(),
        }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: "green",
            width: 2,
          }),
        }),
      });

      const waterwayLayer = new ol.layer.Vector({
        title: "Waterway",
        visible: false,
        source: new ol.source.Vector({
          url: "https://transport-gis-backend.onrender.com/api/geojson/Data/Waterway/Waterway.geojson",
          format: new ol.format.GeoJSON(),
        }),
        style: new ol.style.Style({
          stroke: new ol.style.Stroke({
            color: "cyan",
            width: 2,
          }),
        }),
      });

      // Add all layers to the map
      map.addLayer(highSpeedRailwayGroup);
      map.addLayer(regularRailwayLayer);
      map.addLayer(railwayStationLayer);
      map.addLayer(motorwayLayer);
      map.addLayer(highwayLayer);
      map.addLayer(waterwayLayer);

      // Add popup for features
      const popup = new ol.Overlay({
        element: document.createElement("div"),
        positioning: "bottom-center",
        stopEvent: false,
      });
      map.addOverlay(popup);

      map.on("click", function (evt) {
        const feature = map.forEachFeatureAtPixel(
          evt.pixel,
          function (feature) {
            return feature;
          }
        );

        if (feature) {
          const properties = feature.getProperties();
          let content = '<div class="popup-content">';
          for (let prop in properties) {
            if (
              prop !== "geometry" &&
              properties[prop] !== null &&
              properties[prop] !== undefined
            ) {
              content += `<p><strong>${prop}:</strong> ${properties[prop]}</p>`;
            }
          }
          content += "</div>";
          popup.getElement().innerHTML = content;
          popup.setPosition(evt.coordinate);
        } else {
          popup.setPosition(undefined);
        }
      });

      // Add layer switcher
      const layerSwitcher = new ol.control.LayerSwitcher({
        tipLabel: "Layers",
        groupSelectStyle: "group",
      });
      map.addControl(layerSwitcher);
    </script>
  </body>
</html>
